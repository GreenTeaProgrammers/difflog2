services:
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: difflog_frontend
    depends_on:
      - db
      - minio
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=mysql://root:example@db:3306/difflog
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=change-me
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=difflog
      - MINIO_PUBLIC_URL=http://localhost:9000
  db:
    image: mysql:8.0
    container_name: difflog_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: difflog
    volumes:
      - db_data:/var/lib/mysql
  minio:
    image: minio/minio
    container_name: difflog_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
  minio_init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/difflog || true;
      /usr/bin/mc anonymous set download local/difflog || true;
      exit 0;
      "

volumes:
  db_data:
  minio_data:
